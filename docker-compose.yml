version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: minecraft-mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root123456
      MYSQL_DATABASE: minecraft_server
      MYSQL_USER: minecraft
      MYSQL_PASSWORD: minecraft123456
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./mysql/init.sql:/docker-entrypoint-initdb.d/init.sql
    command: --default-authentication-plugin=mysql_native_password --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - minecraft-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: minecraft-backend
    restart: always
    ports:
      - "8000:8000"
    environment:
      - NODE_ENV=production
      - DATABASE_HOST=mysql
      - DATABASE_PORT=3306
      - DATABASE_USER=minecraft
      - DATABASE_PASSWORD=minecraft123456
      - DATABASE_NAME=minecraft_server
      - JWT_SECRET=minecraft_jwt_secret_key_2024
      - PORT=8000
      # 受信代理配置：仅当后端部署在反向代理之后时设置，用于正确解析客户端真实 IP。
      # 未设置时不信任任何 X-Forwarded-For 头（防止客户端伪造 IP）。
      # 示例：代理与后端同机部署用 "1"；或填代理 IP/CIDR，如 "127.0.0.1,10.0.0.0/8"
      # - TRUST_PROXY=1
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - minecraft-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: minecraft-frontend
    restart: always
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000
    depends_on:
      - backend
    networks:
      - minecraft-network

volumes:
  mysql_data:

networks:
  minecraft-network:
    driver: bridge
